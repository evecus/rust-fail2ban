[package]
name = "silk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
silk-ebpf-common = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
aya = "0.13"
aya-obj = "0.2"
bytes = "1"
rand = "0.8"
quinn = { version = "0.11.7", default-features = false, features = ["log", "runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
ring = "0.17"
fst = "0.4"
serde_json = "1"

[features]
# Compiles in the eBPF object built from ../silk-ebpf.
ebpf = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ebpf"))'] }
