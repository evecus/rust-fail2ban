# silk configuration (TOML)
# Copy to /etc/silk/config.toml or pass --config <path>.

[general]
# LAN capture interface (gateway mode), e.g. your bridge or LAN NIC.
# Omit to run host-only mode (no LAN capture).
# "auto" resolves to the default-route device.
lan_interface = "auto"

# WAN capture interface (host mode): captures locally-originated egress.
# Omit to disable host-originated capture.
wan_interface = "auto"

# Skb mark steering traffic into the proxy namespace. Change only if it
# collides with something else on the box.
# tproxy_mark = 0x2027

# Verdict when no rule matches: "direct" | "proxy" | "block".
default_verdict = "proxy"

# Outbound protocol: "socks5" | "hysteria2" | "vless" | "" (none).
# Can be empty when no rule / default_verdict uses "proxy" and DNS has no
# remote_upstream — [socks5]/[hysteria2]/[vless] may then be omitted entirely.
outbound = "socks5"

[socks5]
# Upstream SOCKS5 server that receives all proxied flows.
# Optional section; only required when outbound = "socks5" and proxy is used.
server = "127.0.0.1:1080"
# Optional username/password auth (RFC 1929).
username = ""
password = ""

[hysteria2]
# Hysteria2 server "host:port" or "ip:port" (hostname resolved via system
# DNS at startup, before the eBPF hooks are attached).
# Optional section; only required when outbound = "hysteria2".
server = "example.com:443"
# Auth credential (the server's auth password).
password = ""
# TLS SNI; defaults to the server host.
sni = ""
# Skip server certificate verification (self-signed servers).
insecure = false
# Local bandwidth limits ("100 Mbps", "80", empty = auto/congestion control).
# up is our upload (Brutal-style pacing); down is advertised to the server
# via Hysteria-CC-RX.
up = ""
down = ""

[vless]
# VLESS server (Xray-compatible). Optional section; only required when
# outbound = "vless".
# Transport: "tcp" | "ws". TLS is optional (`tls = true`) on either transport.
server = "example.com:443"
# VLESS user id (UUID, required).
uuid = "00000000-0000-0000-0000-000000000000"
# "tcp" (raw VLESS) or "ws" (VLESS over WebSocket).
network = "tcp"
# Wrap the transport in TLS. Off for plain tcp/ws (e.g. behind your own
# TLS-terminating frontend).
tls = true
# TLS SNI; defaults to the server host.
sni = ""
# Skip server certificate verification (self-signed servers).
insecure = false
# WebSocket path (network = "ws"); defaults to "/".
ws_path = "/"
# WebSocket Host header; defaults to the SNI.
ws_host = ""

[dns]
# Upstream resolver queried directly (bypasses the datapath via the
# control-plane mark). UDP only.
upstream = "223.5.5.5:53"
# Optional overseas resolver, queried THROUGH the proxy (split DNS).
# Proxy-routed domains, and unmatched domains whose domestic answer is not a
# CN/direct address, are resolved here, so poisoned answers never reach
# clients. Leave unset to resolve everything with `upstream`.
# remote_upstream = "8.8.8.8:53"

[sniff]
# Peek at the first bytes of every proxied TCP flow for a TLS SNI / HTTP Host.
# A sniffed domain re-runs the domain rules (direct -> dialled locally,
# block -> dropped) and is used to dial the proxy exit by name.
enable = true
# Dial the proxy exit with the domain (sniffed, or remembered from the DNS
# answer when it maps to exactly one name) instead of the bare IP, so the
# exit resolves it itself and poisoned local answers never matter.
dial_by_domain = true

# Per-process policy by cgroup v2 (host-originated traffic only; forwarded LAN
# traffic has no cgroup). `path` is relative to /sys/fs/cgroup (or absolute);
# a rule covers the whole subtree and the deepest matching rule wins.
#   mode = "bypass"  never captured: always direct (e.g. frps, sshd, a VPN)
#   mode = "proxy"   public destinations are forced through the proxy,
#                    whatever the CIDR/domain/port rules say (block still
#                    blocks; local/private destinations are untouched)
# Cgroup ids change when a service restarts; they are re-resolved every 3 s.
# [[cgroups]]
# path = "system.slice/frps.service"
# mode = "bypass"
#
# [[cgroups]]
# path = "system.slice/qbittorrent.service"
# mode = "proxy"

# Ordered rule list; first matching surface wins.
#   kind = "cidr"   value = "10.0.0.0/8"      verdict = direct|proxy|block
#   kind = "port"   value = "443"             verdict = direct|proxy|block
#   kind = "domain" value = "example.com"     verdict = direct|proxy|block
#   kind = "source" value = "/etc/silk/geosite.json" verdict = direct
#   kind = "binary" value = "/etc/silk/cn.ars"       verdict = direct
# "source" (alias "list"): plain list OR sing-box JSON. Domains stay as Vec
# rules at runtime — no FST at startup. Convert offline for large sets:
#   silk --convert-ruleset geosite.json cn.ars
# "binary": ARST FST file (built by --convert-ruleset or ant-compatible tools).
# Path ending in .ars / magic ARST under source/list is auto-promoted to binary.
# Domain rules are suffix matches (labels); "cn" matches any *.cn. The
# verdict is applied to every IP the domain resolves to, so domain routing
# works for the subsequent data packets without eBPF ever parsing DNS.
[[rules]]
kind = "cidr"
value = "10.0.0.0/8"
verdict = "direct"

[[rules]]
kind = "cidr"
value = "192.168.0.0/16"
verdict = "direct"

[[rules]]
kind = "domain"
value = "cn"
verdict = "direct"

[[rules]]
kind = "domain"
value = "google.com"
verdict = "proxy"

[[rules]]
kind = "port"
value = "25"
verdict = "block"

# Ruleset file import examples:
# [[rules]]
# kind = "source"
# value = "/etc/silk/geosite-cn.json"
# verdict = "direct"
#
# [[rules]]
# kind = "binary"
# value = "/etc/silk/cn.ars"
# verdict = "direct"
