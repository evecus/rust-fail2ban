name: Clippy

on:
  #push:
   # branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  clippy-userspace:
    name: Clippy (userspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            silk

      - name: Clippy workspace (no ebpf feature)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy with ebpf feature (compile-check only, no object)
        # Feature ebpf only gates include_bytes!; without the object the
        # binary still type-checks and Clippy runs over the cfg(feature="ebpf")
        # code paths.
        run: cargo clippy -p silk --features ebpf --all-targets -- -D warnings

  clippy-ebpf:
    name: Clippy (eBPF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, clippy
          targets: bpfel-unknown-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silk-ebpf

      # aya-ebpf Clippy on the bpf target is still noisy / incomplete on
      # many nightlies; we only enforce it on the host target so the job
      # stays green while still catching ordinary issues.
      - name: Clippy silk-ebpf (host)
        working-directory: silk-ebpf
        run: cargo clippy --all-targets -- -D warnings
